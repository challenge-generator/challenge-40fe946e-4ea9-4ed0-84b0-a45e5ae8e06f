name: flutter_code_metrics_app
description: A Flutter project focused on code quality metrics implementation and validation.
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  dio: ^5.7.0
  get_it: ^8.0.3
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_lints: ^5.0.0
  dart_code_metrics: ^5.7.6
  very_good_analysis: ^5.2.0

flutter:
  uses-material-design: true
  assets:
    - tools/code_metrics/config/metrics_thresholds.json

# Configuración de análisis estático y métricas de código
analyzer:
  plugins:
    - dart_code_metrics
  errors:
    unused_local_variable: warning
    unused_import: error
    invalid_annotation_target: ignore
  exclude:
    - "**.g.dart"
    - "**.freezed.dart"
    - "test/**"

# Umbrales de métricas de código
dart_code_metrics:
  anti-patterns:
    - long-method
    - long-parameter-list
  metrics:
    cyclomatic-complexity: 10
    maximum-nesting-level: 4
    number-of-parameters: 4
    source-lines-of-code: 50
  metrics-exclude:
    - "test/**"
  rules:
    - avoid-unused-parameters:
        severity: error
    - avoid-nested-conditional-expressions:
        severity: error
    - avoid-missing-enum-constant-in-map:
        severity: error
    - binary-expression-operand-order:
        severity: warning
    - double-literal-format:
        severity: warning
    - no-boolean-literal-compare:
        severity: warning
    - no-empty-block:
        severity: warning
    - prefer-conditional-expressions:
        severity: warning
    - prefer-intl-name:
        severity: warning
    - prefer-match-file-name:
        severity: warning
    - avoid-global-state:
        severity: error
    - avoid-shadowing:
        severity: warning
    - avoid-unnecessary-type-casts:
        severity: warning
    - avoid-unnecessary-type-assertions:
        severity: warning
    - avoid-unrelated-type-assertions:
        severity: error
    - avoid-unused-generics:
        severity: error
    - avoid-dynamic:
        severity: warning
    - avoid-passing-async-when-sync-expected:
        severity: error
    - avoid-redundant-async:
        severity: warning
    - avoid-unnecessary-setstate:
        severity: warning
    - avoid-late-keyword:
        severity: warning
    - prefer-first:
        severity: warning
    - prefer-last:
        severity: warning
    - prefer-correct-edge-insets-constructor:
        severity: warning
    - prefer-single-widget-per-file:
        severity: warning
    - prefer-extracting-callbacks:
        severity: warning
    - avoid-duplicate-exports:
        severity: error
    - avoid-returning-widgets:
        severity: warning
    - prefer-text-rich:
        severity: warning
    - prefer-const-border-radius:
        severity: warning
    - prefer-correct-type-name:
        severity: warning
    - prefer-correct-test-file-name:
        severity: warning